dock_coordinator:
  ros__parameters:
    # Staging distance from dock face (metres)
    # The robot will drive here via Nav2 before starting visual search.
    staging_distance: 1.0

    # Dock database — keyed by dock_id
    docks:
      default:
        # Physical coordinates of the marker in the warehouse.sdf (now on Box 1)
        dock_x: -1.875
        dock_y: -1.614
        dock_yaw: 3.14159
        
        # Staging pose (1.0m East of dock, facing West)
        staging_x: -0.875
        staging_y: -1.614
        staging_yaw: 3.14159
        # Nav2 controller choice for STAGING: mppi | rpp | dwb (pins controller_id via BT override)
        staging_controller: mppi

aruco_detector:
  ros__parameters:
    dock_id: default
    docks:
      default:
        markers:
          # Dock frame origin at center marker (ID 0)
          m0: {x: 0.0, y: 0.0, z: 0.0, yaw_deg: 0.0}
          # Flipped funnel geometry (matches gzworld/warehouse.sdf)
          m1: {x: -0.042, y: -0.085, z: 0.0, yaw_deg: -45.0}
          m2: {x: -0.042, y:  0.085, z: 0.0, yaw_deg:  45.0}
