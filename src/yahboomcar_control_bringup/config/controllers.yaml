controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    # SolidWorks-exported joint names. Keep the URDF untouched and configure here.
    left_wheel_names: ["zq_Joint", "zh_Joint"]
    right_wheel_names: ["yq_Joint", "yh_Joint"]

    # Initial guesses; tune once sim is stable.
    wheel_separation: 0.135
    wheel_radius: 0.0325

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: false
    publish_rate: 50.0

    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    right_wheel_radius_multiplier: -1.0


